aid: kiko-labs
name: Kiko Labs
description: Kiko Labs is a neuroscience-based early-learning company (a 500 Global portfolio company)
  that builds adaptive brain-training games for children ages 3-7. Its flagship product, Kiko's Thinking
  Time, is a voice-guided iOS app developed with Harvard and UC Berkeley neuroscientists with support
  from the US Department of Education and National Science Foundation. The program trains executive
  functions — working memory, inhibition, focus, and cognitive flexibility — through progressive games,
  and includes a parent and educator dashboard for tracking skill development. Kiko Labs is a consumer
  edtech company and does not currently publish a public developer API surface.
